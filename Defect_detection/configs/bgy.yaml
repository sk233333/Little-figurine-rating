# ============================================================
# bgy 款配置
# 实物：Q 版盲盒玩偶，高度 < 5cm（按 45mm 计）
# 原图 541x484，物体 353x391px -> 原始尺度 8.7 px/mm
# ============================================================

sku: bgy

# ---------- 成像 / 尺度 ----------
# 玩偶实物高度(mm)。500mm 大件就填 500
object_height_mm: 45.0
# 若你已精确标定 mm/px（原图尺度），直接填这里；否则留空用 object_height_mm 推导
mm_per_px_orig: null
# 归一化目标：每毫米多少像素。0.5mm 要占 3px -> px/mm >= 6.67
# 45mm * 22.8 = 1026 -> canon=1024，与原图尺度(~20.8 px/mm)相当：
# 避免降采样(512 时 0.52x)把 2~3px 的深色瑕疵平均掉（实测同一黑点 z 9.5 -> 5.4）
canon_target_px_per_mm: 22.8
# 归一化图最大边长（防止爆内存）
canon_max_px: 3072
canon_min_px: 1024

# ---------- ROI ----------
# 单个 ROI 物理边长(mm)。约束: roi_mm <= 171 * 阈值(mm)
# 阈值 0.5mm -> roi_mm <= 85；本款物体仅 45mm 高，取 20mm 切 3x3 网格
roi_mm: 20.0
roi_overlap: 0.12          # ROI 之间重叠比例，防跨块瑕疵被切碎
roi_out_px: 512            # 送进 PatchCore 的尺寸
roi_min_cover: 0.35        # ROI 内物体像素占比低于此值则丢弃
roi_max_count: 6           # 每张最多保留几个 ROI(按覆盖率取前N)，防止模型数量爆炸
roi_mode: key              # key=只切关键区(推荐,4~6块)  grid=全覆盖(块多)
level1_px: 512             # 整图粗检尺寸

# 关键区（归一化坐标 0~1，相对 canonical 正方形）
key_regions:
  - [0.20, 0.08, 0.80, 0.48]     # 头/胸
  - [0.12, 0.40, 0.88, 0.92]     # 身体主体

# ---------- PatchCore ----------
patchcore:
  backbone: wide_resnet50_2
  layers: [layer2, layer3]
  coreset_sampling_ratio: 0.05   # 开了姿态增强要压低，否则 memory bank 爆炸
  num_neighbors: 3               # 小瑕疵别被平滑掉

# ---------- 样本筛选 ----------
# 正常(OK)样本白名单：只有列在这里的 stem 会参与训练。
# 留空 = rois/<sku>/ 下所有样本都当作正常 —— 瑕疵图混进来会污染 memory bank！
# 本款 30 张经确认为全 OK 品，故留空。
normal_stems: []

# ---------- 训练 ----------
train:
  epochs: 1                      # PatchCore 是单遍特征入库，1 epoch 即可
  batch_size: 8
  num_workers: 0
  val_ratio: 0.2

# ---------- 阈值标定 ----------
# 在「留出的 OK 图」的异常图上按像素取分位数作 map_thresh，
# 直接控制像素级误报率。分位数越高越保守（越不容易报错，但小瑕疵也越难报出）。
calib:
  quantile: 0.9999
  # 按 ROI 覆盖分位数。统一高分位数对低方差 ROI 合适，但对方差大的 ROI 会把
  # 阈值顶到接近 OK 峰值(roi_005 的 OK max=0.9876)，导致该区域中等瑕疵被吞；
  # 此时给该 ROI 单独降分位数（roi_005 降到 0.995 -> 阈值约 0.855）。
  quantile_by_roi:
    roi_005: 0.995

# ---------- 姿态增强（训练时做，推理时不做）----------
aug:
  enable: true
  copies: 8
  rot_deg: 5.0
  translate: 0.03
  scale: 0.05
  brightness: 0.08

# ---------- 阈值（单位 mm，等效直径）----------
# 检测下限 ~0.35mm（3px * 0.115 mm/px 原图尺度），阈值需高于此
thresholds_mm:
  face: 0.5      # 脸 / 正面主视觉（A面）
  body: 0.8      # 侧面、手臂、背（B面）
  hidden: 1.2    # 底部、内侧、被遮挡（C面）

# 分区（归一化坐标），用于判定瑕疵落在哪个区；自下而上匹配，后面的优先
zones:
  hidden:
    - [0.00, 0.85, 1.00, 1.00]
  face:
    - [0.25, 0.05, 0.75, 0.40]
  body:
    - [0.00, 0.00, 1.00, 1.00]   # 兜底：其余都算 body

# 设计图案屏蔽区（归一化坐标矩形），这些区域不参与判级
exclude_regions: []

# ---------- 判级 ----------
grading:
  t1: 1.0        # <= t1 且数量少 -> 微瑕
  t2: 2.0        # <= t2 -> 明显瑕疵；> t2 -> 残次
  escalate_count: 3   # 达到这个数量，等级往上提一级

# ---------- 异常图阈值 ----------
# 训练后自动标定写入 results/<sku>/<roi>/threshold.json
# 这里的值仅在标定失败时兜底
map_thresh: 0.5

# 单个「瑕疵」的等效直径上限(mm)。超过它的连通域不是局部瑕疵，
# 而是整片光照/配准偏差，会被单独记入 region_anomalies 且不参与判级。
# 物体高 45mm，取 15mm ≈ 物体高度的 1/3。0 = 关闭该保护。
max_defect_mm: 15.0

# ---------- 单图无参考表面异常检测（ref_free.py）----------
# 不依赖参考图/跨图配准，只用单张图自身的低频背景差分 + 定向线状匹配滤波，
# 检出 PatchCore 抓不到的「细长 / 低对比」表面瑕疵（污渍、划痕、色斑）。
# 另有一条并行的「暗斑(大黑点)」支路：黑点对比度高达 ~100 灰阶（远高于污渍的
# 12~16 灰阶），信噪比高一个量级，故用更直接的判据（物体掩膜 + 环亮度/绝对暗度），
# 实测 bgy 30 张 OK 件 0 误报，用户上传的大黑点必然命中。
# 输出候选框供人工复核，不参与自动判级。
ref_free:
  bg_sigma: 6.0           # 低频背景高斯尺度(px)
  line_sigma: 12.0        # 定向积分核长度尺度(px)
  angles: 12              # 方向数(180° 均分)
  min_support: 0.3        # 窗口内表面占比下限，低于此不参与(防除小数)
  chroma_max: 25.0        # 表面色度上限(LAB)，超过视为彩色设计图案
  design_gray: 180        # 灰阶下限，低于视为深色设计图案
  design_dilate: 9        # 设计图案掩膜膨胀(px)
  grad_max: 40.0          # 表面梯度上限(Sobel)，超过视为轮廓/花纹边
  obj_erode: 9            # 物体掩膜内缩(px)，去掉轮廓带
  noise_percentile: 90.0  # 全局噪声尺度分位(90 -> 1.2816σ 估计，也是局部尺度下限基准)
  local_win: 81           # 局部尺度窗口(px)，0=退回全局 σ(此时 z 跨图不可比)
  local_floor: 0.5        # 局部尺度下限 = f·σ_global，防除零/防放大平坦区
  z_thresh: 6.0           # 固定阈值(局部归一化后跨图可比)；<=0 则用 thresh_quantile
  thresh_quantile: 0.0    # >0 时改用本图分位阈值(随图自适应，实测误报 26/30 张，不可用)
  min_area: 20            # 最小连通面积(px)；去噪改用 despeckle 后由 8 提到 20，抑制毛绒细纹噪声
  min_mm: 0.0             # 最小等效直径(mm)，0=不启用
  max_mm: 15.0            # 最大等效直径(mm)，超过视为整片光照
  colormap_scale: 12.0    # 热力图色标满量程 z
  # --- 暗斑(大黑点/脸眼细瑕)支路（局部尺度用 MAD + 小窗，见 ref_free.py 公式 (7)）---
  dark_enable: true       # 是否启用暗斑检测
  dark_z: 8.0             # 暗斑 z 阈值(局部归一化后跨图可比)
  dark_min_px: 1          # 暗斑最小连通面积(px)；细暗弧经 despeckle 后可只剩 1px
  dark_max_px: 400        # 暗斑最大连通面积(px)，超过视为大片深色设计图案
  dark_z_peak_min: 12.0   # 连通域内 z 峰值下限，滤掉低对比噪声块
  dark_ring_mm: 0.2       # 紧贴环宽度(mm)；宽环(1.0)会探入相邻深蓝虹膜，反被环门限拒绝
  dark_ring_gray: 140.0   # 紧贴环灰度下限，低于视为深色设计图案(眼睛/花纹)
  dark_contrast: 30.0     # 环-核灰度差下限(绝对暗度)，防把柔和阴影当黑点
  dark_core_gray_min: 60.0    # 核灰度下限；低于此视为纯黑设计区(鼻/虹膜 core≈15~34)
  dark_ring_hue_min: 60.0     # 紧贴环色相中位数下限(H∈[0,180])，核心判别量
  dark_ring_sat_min: 60.0     # 紧贴环饱和度中位数下限
  dark_ring_std_max: 25.0     # 紧贴环灰度标准差上限；必需，否则合模线误报
  dark_ring_hue_std_max: 2.5  # 紧贴环环形色相标准差上限(度)
  dark_scale_mad: true    # True=MAD 尺度(抗设计边界/瑕疵自身抬爆)，False=滑窗 std
  dark_local_win: 21      # 局部尺度窗口(px)，0=退回全局 σ
  dark_scale_floor: 0.5   # 局部尺度下限 = f·σ_global，防平坦区除零放大
  # --- 细划痕/毛发支路 ---
  scratch_enable: true    # 是否启用细划痕检测
  scratch_bg_k: 31        # 中值背景核(px，奇数)；划痕仅 2~4px 宽，中值背景不糊掉它
  scratch_contrast: 40.0  # 暗于中值背景的灰阶下限 (bg − gray > c)
  scratch_mask_close: 15  # 物体掩膜闭运算核(px)；划痕常落在掩膜缝隙处，需先补缝
  scratch_min_px: 20      # 最小连通面积(px)
  scratch_max_px: 600     # 最大连通面积(px)，超过视为成片暗区(交给其它支路)
  scratch_aspect_min: 2.0 # 长宽比下限：细长线状
  scratch_ring_px: 8      # 紧贴环宽度(px)
  scratch_ring_gray: 215.0     # 紧贴环灰度下限：周围须是亮面(白毛绒/白塑料)
  scratch_ring_sat: 30.0       # 紧贴环饱和度上限：周围须是中性(非彩色)
  scratch_core_gray_min: 80.0  # 核灰度下限：排除纯黑设计图案(眼/鼻 core≈15~34)
  scratch_core_gray_max: 210.0 # 核灰度上限：须明显暗于环(中性灰划痕，非亮纹理)
  scratch_edge_mm: 0.7    # 到物体轮廓(最大连通域填洞后)的最小距离(mm)，**核心判别量**

# ---------- 可接受清单（仅写进报告，给人看）----------
accept_list:
  - 合模线
  - 顶针痕
  - 轻微套色偏移
