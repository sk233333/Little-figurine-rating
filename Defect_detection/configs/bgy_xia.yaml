# ============================================================
# bgy 款配置 —— 瑕图测试集
# 与 bgy.yaml 完全一致，仅 sku 不同：
#   测试集目录独立(canononical/bgy_xia, rois/bgy_xia, reports/bgy_xia)，
#   避免瑕图被 train_pc 当正常样本污染 memory bank。
# 模型与阈值仍复用 results/bgy/ (infer.py --model-sku bgy)。
# ============================================================

sku: bgy_xia

# ---------- 成像 / 尺度 ----------
# 玩偶实物高度(mm)。500mm 大件就填 500
object_height_mm: 45.0
# 若你已精确标定 mm/px（原图尺度），直接填这里；否则留空用 object_height_mm 推导
mm_per_px_orig: null
# 归一化目标：每毫米多少像素。0.5mm 要占 3px -> px/mm >= 6.67
# 45mm * 22.8 = 1026 -> canon=1024，与原图尺度(~20.8 px/mm)相当：
# 避免降采样(512 时 0.52x)把 2~3px 的深色瑕疵平均掉（实测同一黑点 z 9.5 -> 5.4）
canon_target_px_per_mm: 22.8
# 归一化图最大边长（防止爆内存）
canon_max_px: 3072
canon_min_px: 1024

# ---------- ROI ----------
# 单个 ROI 物理边长(mm)。约束: roi_mm <= 171 * 阈值(mm)
# 阈值 0.5mm -> roi_mm <= 85；本款物体仅 45mm 高，取 20mm 切 3x3 网格
roi_mm: 20.0
roi_overlap: 0.12          # ROI 之间重叠比例，防跨块瑕疵被切碎
roi_out_px: 512            # 送进 PatchCore 的尺寸
roi_min_cover: 0.35        # ROI 内物体像素占比低于此值则丢弃
roi_max_count: 6           # 每张最多保留几个 ROI(按覆盖率取前N)，防止模型数量爆炸
roi_mode: key              # key=只切关键区(推荐,4~6块)  grid=全覆盖(块多)
level1_px: 512             # 整图粗检尺寸

# 关键区（归一化坐标 0~1，相对 canonical 正方形）
key_regions:
  - [0.20, 0.08, 0.80, 0.48]     # 头/胸
  - [0.12, 0.40, 0.88, 0.92]     # 身体主体

# ---------- PatchCore ----------
patchcore:
  backbone: wide_resnet50_2
  layers: [layer2, layer3]
  coreset_sampling_ratio: 0.05   # 开了姿态增强要压低，否则 memory bank 爆炸
  num_neighbors: 3               # 小瑕疵别被平滑掉

# ---------- 样本筛选 ----------
# 瑕图测试集不参与训练，此配置不会被 train_pc 使用
normal_stems: []

# ---------- 训练 ----------
train:
  epochs: 1                      # PatchCore 是单遍特征入库，1 epoch 即可
  batch_size: 8
  num_workers: 0
  val_ratio: 0.2

# ---------- 阈值标定 ----------
# 与 bgy.yaml 保持一致（本文件不参与训练，仅记录测试集口径）
calib:
  quantile: 0.9999
  quantile_by_roi:
    roi_005: 0.995

# ---------- 姿态增强（训练时做，推理时不做）----------
aug:
  enable: true
  copies: 8
  rot_deg: 5.0
  translate: 0.03
  scale: 0.05
  brightness: 0.08

# ---------- 阈值（单位 mm，等效直径）----------
thresholds_mm:
  face: 0.5      # 脸 / 正面主视觉（A面）
  body: 0.8      # 侧面、手臂、背（B面）
  hidden: 1.2    # 底部、内侧、被遮挡（C面）

# 分区（归一化坐标），用于判定瑕疵落在哪个区；自下而上匹配，后面的优先
zones:
  hidden:
    - [0.00, 0.85, 1.00, 1.00]
  face:
    - [0.25, 0.05, 0.75, 0.40]
  body:
    - [0.00, 0.00, 1.00, 1.00]   # 兜底：其余都算 body

# 设计图案屏蔽区（归一化坐标矩形），这些区域不参与判级
exclude_regions: []

# ---------- 判级 ----------
grading:
  t1: 1.0        # <= t1 且数量少 -> 微瑕
  t2: 2.0        # <= t2 -> 明显瑕疵；> t2 -> 残次
  escalate_count: 3   # 达到这个数量，等级往上提一级

# ---------- 异常图阈值 ----------
# 训练后自动标定写入 results/<sku>/<roi>/threshold.json
# 这里的值仅在标定失败时兜底
map_thresh: 0.5

# 单个「瑕疵」的等效直径上限(mm)。超过它的连通域不是局部瑕疵，
# 而是整片光照/配准偏差，会被单独记入 region_anomalies 且不参与判级。
max_defect_mm: 15.0

# ---------- 单图无参考表面异常检测（ref_free.py）----------
# 与 bgy.yaml 保持一致（见 bgy.yaml 注释）
ref_free:
  bg_sigma: 6.0
  line_sigma: 12.0
  angles: 12
  min_support: 0.3
  chroma_max: 25.0
  design_gray: 180
  design_dilate: 9
  grad_max: 40.0
  obj_erode: 9
  noise_percentile: 90.0
  local_win: 81
  local_floor: 0.5
  z_thresh: 6.0
  thresh_quantile: 0.0
  min_area: 20            # 去噪改用 despeckle 后须用较大面积门限抑制毛绒细纹噪声（见模块头 (8)）
  min_mm: 0.0
  max_mm: 15.0
  colormap_scale: 12.0
  # --- 暗斑(大黑点/脸眼细瑕)支路 ---
  dark_enable: true
  dark_z: 8.0
  dark_min_px: 1
  dark_max_px: 400
  dark_z_peak_min: 12.0
  dark_ring_mm: 0.2
  dark_ring_gray: 140.0
  dark_contrast: 30.0
  dark_core_gray_min: 60.0
  dark_ring_hue_min: 60.0
  dark_ring_sat_min: 60.0
  dark_ring_std_max: 25.0
  dark_ring_hue_std_max: 2.5
  dark_scale_mad: true
  dark_local_win: 21
  dark_scale_floor: 0.5
  # --- 细划痕/毛发支路 ---
  scratch_enable: true
  scratch_bg_k: 31
  scratch_contrast: 40.0
  scratch_mask_close: 15
  scratch_min_px: 20
  scratch_max_px: 600
  scratch_aspect_min: 2.0
  scratch_ring_px: 8
  scratch_ring_gray: 215.0
  scratch_ring_sat: 30.0
  scratch_core_gray_min: 80.0
  scratch_core_gray_max: 210.0
  scratch_edge_mm: 0.7

# ---------- 可接受清单（仅写进报告，给人看）----------
accept_list:
  - 合模线
  - 顶针痕
  - 轻微套色偏移
